name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows portable build
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2 / MinGW UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-binutils
            zip
            git

      - name: Configure CMake
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release -DMDR_DISABLE_BLE=ON

      - name: Build
        run: cmake --build build --target SonyHeadphonesClient -j2

      - name: Verify portable (no MinGW DLL deps)
        run: |
          deps=$(objdump -p build/client/SonyHeadphonesClient.exe | grep -iE 'libgcc|libstdc|libwinpthread' || true)
          if [ -n "$deps" ]; then
            echo "Found MinGW runtime DLL deps in exe:"
            echo "$deps"
            exit 1
          fi
          echo "exe is portable (no MinGW runtime DLL deps)"

      - name: Stage release artifacts
        run: |
          mkdir dist
          cp build/client/SonyHeadphonesClient.exe dist/
          cp settings.ini.sample dist/
          cp README.md dist/

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ver="${GITHUB_REF_NAME}"
          else
            ver="manual-$(git rev-parse --short HEAD)"
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $ver"

      - name: Create zip
        run: |
          cd dist
          zip -r "../SonyHeadphonesClient-${{ steps.ver.outputs.ver }}-win-x64-portable.zip" .

      - name: Upload artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SonyHeadphonesClient-${{ steps.ver.outputs.ver }}-win-x64-portable
          path: SonyHeadphonesClient-${{ steps.ver.outputs.ver }}-win-x64-portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SonyHeadphonesClient-${{ steps.ver.outputs.ver }}-win-x64-portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
