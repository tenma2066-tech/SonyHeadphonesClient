name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    name: Windows portable build
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC dev environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Configure CMake
        run: cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target SonyHeadphonesClient -j2

      - name: Verify portable (no MSVC runtime DLL deps)
        run: |
          deps=$(dumpbin //dependents build/client/SonyHeadphonesClient.exe | grep -iE 'vcruntime|msvcp|ucrtbase' || true)
          if [ -n "$deps" ]; then
            echo "Found MSVC runtime DLL deps in exe:"
            echo "$deps"
            exit 1
          fi
          echo "exe is portable (no MSVC runtime DLL deps)"

      - name: Stage release artifacts
        run: |
          mkdir dist
          cp build/client/SonyHeadphonesClient.exe dist/
          cp settings.ini.sample dist/
          cp README.md dist/

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ver="${GITHUB_REF_NAME}"
          else
            ver="manual-$(git rev-parse --short HEAD)"
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $ver"

      - name: Create zip
        run: |
          cd dist
          7z a "../SonyHeadphonesClient-${{ steps.ver.outputs.ver }}-win-x64-portable.zip" .

      - name: Upload artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SonyHeadphonesClient-${{ steps.ver.outputs.ver }}-win-x64-portable
          path: SonyHeadphonesClient-${{ steps.ver.outputs.ver }}-win-x64-portable.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SonyHeadphonesClient-${{ steps.ver.outputs.ver }}-win-x64-portable.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
